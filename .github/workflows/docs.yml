#
# Makes the reference documentation with MrDocs and, from the default branch, publishes it to
# GitHub Pages. For that to work the repository has to have Pages enabled, with "GitHub Actions"
# as the source (Settings > Pages).
#
# A pull request only gets as far as making the documentation, which is where a public symbol
# without a comment shows.
#
name: Docs

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # the release of MrDocs to use, and what its archive for Linux has to hash to -- the same as
  # in .devcontainer/Dockerfile
  MRDOCS_RELEASE: 2026.9.29
  MRDOCS_SHA256: 9d96e42f303046fb0b221aa9071eabccc40b9683e0b7af2b02a929d15476ca6a

jobs:
  build:
    name: reference
    runs-on: ubuntu-latest

    container:
      image: docker.io/psedoc/anyhttp:0.30
      options: --user root

    steps:
      - uses: actions/checkout@v7

      - name: Install MrDocs
        run: |
          curl -sSfL -o /tmp/mrdocs.tar.xz \
            "https://github.com/cppalliance/mrdocs/releases/download/${MRDOCS_RELEASE}/MrDocs-${MRDOCS_RELEASE}-Linux.tar.xz"
          echo "${MRDOCS_SHA256}  /tmp/mrdocs.tar.xz" | sha256sum --check
          mkdir -p /opt/mrdocs
          tar -xJf /tmp/mrdocs.tar.xz -C /opt/mrdocs --strip-components=1
          echo /opt/mrdocs/bin >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset dev

      - name: Make the reference
        run: cmake --build --preset dev --target docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/doc/html

  deploy:
    name: publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
