#
# Makes the documentation, the guide and the reference, with Doxygen and Sphinx and, from the
# default branch, publishes it to GitHub Pages. For that to work the repository has to have Pages
# enabled, with "GitHub Actions" as the source (Settings > Pages).
#
# A pull request only gets as far as making the documentation, which is where a public symbol
# without a comment shows, and a reference that goes nowhere.
#
name: Docs

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: documentation
    # pinned like in ci.yml, bump it deliberately
    runs-on: &runs_on ubuntu-26.04

    container:
      image: docker.io/psedoc/anyhttp:0.31
      options: --user root

    steps:
      - uses: actions/checkout@v7

      # the same as in .devcontainer/Dockerfile
      - name: Install the tools
        run: |
          apt-get update
          apt-get -y install --no-install-recommends \
            doxygen python3-sphinx python3-breathe python3-sphinx-rtd-theme

      - name: Configure
        run: cmake --preset dev

      - name: Make the documentation
        run: cmake --build --preset dev --target docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/doc/html

  deploy:
    name: publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: *runs_on

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
