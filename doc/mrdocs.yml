#
# The reference documentation, made by MrDocs (https://www.mrdocs.com) from the comments in the
# public headers. 'cmake --build build --target docs' runs it, see CMakeLists.txt in here.
#
source-root: ..

# only what is public: the headers under include/, and of those what is in the namespace
input:
  - ../include
include-symbols:
  - 'cares_async::**'
exclude-symbols:
  - 'cares_async::detail::**'

# the export header and the version header are made by CMake, in the build directory
includes:
  - ../include

# one page per symbol, as HTML that needs nothing but a browser
generator: html
multipage: true
show-namespaces: true

# what is not documented is not finished
warnings: true
warn-if-undocumented: true
warn-no-paramdoc: true
warn-broken-ref: true
